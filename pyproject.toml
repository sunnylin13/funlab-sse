[project]
name = "funlab-sse"
version = "0.1.0"
description = "Sever-side Event plugin for funlab flask web application"
authors = [{ name = "sunny", email = "013.lin@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "flask-login>=0.6",
    "sqlalchemy>=2.0",
    "tzlocal>=4.0",
    "pydantic>=2.0",
    "funlab-libs",
]

[project.entry-points."funlab_plugin"]
SSEService = "funlab.sse.service:SSEService"

[dependency-groups]
dev = ["pytest>=8.3.0,<10"]

[tool.uv.sources]
funlab-libs = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["funlab"]

[tool.funlab_plugin_metadata.SSEService]
load_mode = "startup"
security_mode = "required"
